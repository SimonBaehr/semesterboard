<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Semesterboard ABI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: Leitstand. Bewusst nur dunkles Thema. Rasterhintergrund, Glas-Paneele, Daten in Kursfarben, UI in Eis-Cyan. */
:root{
  color-scheme:dark;
  --bg:#0A0E18; --bg2:#0E1424; --panel:#131A2A; --panel2:#18213A; --line:#24304A; --line2:#33425F;
  --ink:#E8EEF8; --ink2:#A7B3C8; --ink3:#6E7B93;
  --accent:#6FE3F5; --accent2:#3BB8D0; --accent-soft:rgba(111,227,245,.12); --on-accent:#05121A;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#e5534b;
  --c-m11:#3987e5; --c-m13:#d95926; --c-m14:#199e70; --c-m15:#c98500; --c-m16:#d55181; --c-m19:#008300; --c-none:#6E7B93;
  --f-display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(59,184,208,.13),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(85,81,213,.10),transparent 60%),linear-gradient(rgba(111,227,245,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(111,227,245,.035) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink2)}
h3{font-size:1rem;font-weight:600}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-display);font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;color:var(--ink3);font-weight:600}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:18px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(10,14,24,.6);backdrop-filter:blur(8px)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;font-family:var(--f-display);font-weight:700;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),#7d7bff);box-shadow:0 0 24px rgba(111,227,245,.35)}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;border:0;background:none;padding:8px 0;border-radius:12px;cursor:pointer;color:var(--ink3);font-size:.62rem;font-weight:600;letter-spacing:.04em}
.nav-btn svg{width:21px;height:21px}
.nav-btn:hover{color:var(--ink);background:var(--panel)}
.nav-btn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav-btn[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.sync{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.6rem;color:var(--ink3);text-align:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink3)}
.dot.live{background:var(--good);box-shadow:0 0 0 0 rgba(12,163,12,.6)}
@media (prefers-reduced-motion:no-preference){.dot.live{animation:pulse 2.4s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.55)}70%{box-shadow:0 0 0 8px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}}

main{padding-inline:clamp(16px,3.4vw,36px);padding-block:22px 110px;min-width:0;max-width:1320px;width:100%}
.top{display:flex;flex-wrap:nowrap;gap:12px 20px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.refresh{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--accent);cursor:pointer;display:grid;place-items:center;transition:all .15s}
.refresh:hover{border-color:var(--accent);box-shadow:0 0 16px rgba(111,227,245,.35)}
.refresh.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.kbd{font-family:var(--f-mono);font-size:.7rem;color:var(--ink3);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;white-space:nowrap}

.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:1060px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
.panel{position:relative;background:linear-gradient(180deg,rgba(24,33,58,.82),rgba(19,26,42,.82));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;backdrop-filter:blur(6px)}
.panel.hud::before,.panel.hud::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--accent);opacity:.7}
.panel.hud::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--r)}
.panel.hud::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--r)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{color:var(--ink3);font-size:.88rem;padding:6px 0}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.clock{font-family:var(--f-mono);font-size:clamp(2.4rem,6vw,3.6rem);font-weight:500;line-height:1;letter-spacing:-.02em}
.clock .sec{color:var(--accent);font-size:.45em;margin-left:4px}
.semprog{margin-top:14px}
.semprog .track{position:relative;height:10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.semprog .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 14px rgba(111,227,245,.5);border-radius:99px}
.semprog .ticks{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--f-mono);font-size:.68rem;color:var(--ink3)}
.next{border-left:1px solid var(--line);padding-left:20px;display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:760px){.next{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}}
.next .cdn{font-family:var(--f-mono);font-size:.82rem;color:var(--accent);opacity:.85}
.nwhen{display:flex;flex-direction:column;line-height:1.1}
.nday{font-family:var(--f-display);font-size:1.45rem;font-weight:600;letter-spacing:.02em}
.ntime{font-family:var(--f-mono);font-size:2.3rem;font-weight:600;color:var(--accent);text-shadow:0 0 18px rgba(111,227,245,.35)}
.ntime .nend{font-size:1.1rem;color:var(--ink3);text-shadow:none;font-weight:500}
.where{font-size:.88rem;color:var(--ink2);overflow-wrap:anywhere}
.commute-mini{display:flex;align-items:center;gap:8px;margin-top:6px;padding:6px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:.84rem;width:fit-content;max-width:100%}
.commute-mini span{color:var(--ink)}
.cm-main{display:flex;gap:12px;align-items:center;margin-bottom:10px;color:var(--accent)}
.cm-dep{font-size:1.05rem;color:var(--ink)}.cm-dep b{font-family:var(--f-mono);font-size:1.35rem;color:var(--accent)}
.cm-line{display:inline-block;background:#00975f;color:#fff;font-weight:700;border-radius:999px;padding:1px 8px;font-size:.8rem;margin-right:4px}
.commute .meta{font-size:.82rem;color:var(--ink2)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:2px}
.chip.crit{border-color:rgba(229,83,75,.5);color:#ff8a82}
.chip.warn{border-color:rgba(250,178,25,.45);color:var(--warn)}

/* Countdown */
.countdowns{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cd{flex:0 0 auto;width:178px;display:flex;flex-direction:column;justify-content:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);position:relative;overflow:hidden;cursor:pointer;text-align:left}
.cd::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);background:var(--cc)}
.cd:hover{border-color:var(--line2)}
.cd .days{font-family:var(--f-mono);font-size:2rem;font-weight:500;line-height:1}
.cd .days span{font-size:.75rem;color:var(--ink3);margin-left:4px}
.cd .t{font-size:.78rem;margin-top:6px;line-height:1.3;color:var(--ink2)}
.cd .st{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;margin-top:6px}
.cd.crit .st{color:#ff8a82}.cd.warn .st{color:var(--warn)}

/* Listen */
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0;overflow-wrap:anywhere}
.item .meta{font-size:.76rem;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.item.done .title{text-decoration:line-through;color:var(--ink3)}
.check{appearance:none;width:20px;height:20px;border:1.5px solid var(--line2);border-radius:6px;flex:none;margin-top:2px;cursor:pointer;display:grid;place-items:center;background:var(--bg2);transition:all .15s}
.check:hover{border-color:var(--accent)}
.check:checked{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(111,227,245,.5)}
.check:checked::after{content:"";width:10px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.lh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.lh h2{margin:0;font-size:1rem}.lh .cnt{font-family:var(--f-mono);color:var(--ink3);font-weight:500;margin-left:6px;font-size:.85rem}
.plus{width:34px;height:34px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:1.25rem;line-height:1;cursor:pointer;display:grid;place-items:center;flex:none;transition:all .15s}
.plus:hover,.plus[aria-expanded="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 0 16px rgba(111,227,245,.4)}
.addbox{padding:12px 0 6px;border-bottom:1px solid var(--line)}.addbox .inline{margin:0}
.prow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.prow:first-of-type{border-top:0}
.prow .pdate{flex:0 0 46px;text-align:center;border-left:3px solid var(--cc);padding-left:6px;line-height:1.1}.prow .pdate b{display:block;font-size:1.2rem}.prow .pdate span{font-size:.72rem;color:var(--ink3)}
.prow .body{flex:1;min-width:0}.prow .title{font-weight:600;font-size:.9rem}.prow.old{opacity:.5}
.pkind{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--warn)}.pkind.exam{color:#ff8a82}.pkind.interim{color:var(--accent)}
.pmonth{margin-bottom:14px}
.wknav{margin-left:auto}.wknav button{font-size:.85rem;padding:4px 12px}.day.past{opacity:.55}
.trow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.trow:first-child{border-top:0}
.trow .body{flex:1;min-width:0;overflow-wrap:anywhere}.trow .title{font-weight:500}.trow .meta{font-size:.74rem;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.trow .due{font-family:var(--f-mono);font-size:.8rem;color:var(--ink2);white-space:nowrap;flex:none;text-align:right;min-width:74px}
.trow .due.warn{color:var(--warn)}.trow .due.crit{color:#ff8a82}.trow .due.none{color:var(--ink3)}
.trow.done .title{text-decoration:line-through;color:var(--ink3)}
.minus{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);font-size:1.15rem;line-height:1;cursor:pointer;flex:none;display:grid;place-items:center}
.minus:hover{border-color:var(--crit);color:#ff8a82}
.gbtn{display:inline-block;margin-top:5px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);text-decoration:none}
.gbtn:hover{background:var(--accent);color:var(--on-accent)}
.gdone{display:inline-block;margin-top:5px;font-size:.72rem;color:#5fd35f}
.saved{font-size:.85rem;color:var(--ink2);margin:6px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.saved .gbtn{margin:0}
.ev{position:relative}.ev .evdel{position:absolute;top:3px;right:2px;min-width:24px;height:22px;padding:0 6px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink3);font-size:.9rem;line-height:1;cursor:pointer}
.ev .evdel:hover{border-color:var(--crit);color:#ff8a82}.ev .evdel.sure{border-color:var(--crit);background:rgba(229,83,75,.18);color:#ff8a82;font-size:.72rem;font-weight:700}
.ev .tm{padding-right:30px}
.x{border:0;background:none;color:var(--ink3);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:.85rem}
.x:hover{background:var(--panel2);color:var(--crit)}
.flag{color:var(--serious);font-weight:700}

.btn{border:1px solid var(--line2);background:var(--panel2);padding:7px 13px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.85rem;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{box-shadow:0 0 18px rgba(111,227,245,.45);color:var(--on-accent)}
.btn.small{padding:3px 10px;font-size:.76rem}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 11px;font-size:.75rem;font-weight:600;cursor:pointer;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
form.inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
form.inline input,form.inline select,form.inline textarea,select.sel{padding:7px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2);min-width:0}
form.inline input[type=text],form.inline textarea{flex:1 1 200px}
textarea{resize:vertical}

/* Charts */
.chart{width:100%;min-height:60px}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink3)}
.chart .lbl{font-family:var(--f-body);font-size:12px;fill:var(--ink2);font-weight:600}
.chart .val{fill:var(--ink);font-weight:600}
.chart .grid line{stroke:var(--line);stroke-width:1}
.hit{cursor:pointer}
.hit:hover .mk{stroke:var(--ink);stroke-width:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.ring{border:1px solid transparent;border-radius:12px;background:none;cursor:pointer;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink2);font-size:.78rem;font-weight:600}
.ring:hover{border-color:var(--line2);background:var(--panel2)}
.ring svg circle{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.ring svg circle{transition:none}}
.pct{font-family:var(--f-mono);font-size:15px;fill:var(--ink);font-weight:600}
.tip{position:fixed;z-index:50;pointer-events:none;background:rgba(10,14,24,.96);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:.78rem;line-height:1.4;max-width:280px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.tip b{color:var(--ink)}
.tip .c{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* Fokus */
.focus{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.focus .dial{position:relative;width:132px;height:132px}
@media (max-width:440px){.focus{grid-template-columns:minmax(0,1fr);justify-items:center}}
.focus .dial .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:1.6rem;font-weight:500}
.focus .dial .t small{display:block;font-size:.6rem;color:var(--ink3);text-align:center;letter-spacing:.1em}

/* Kurse */
.courses{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.course{cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;color:inherit}
.course:hover{border-color:var(--cc);box-shadow:0 0 0 1px var(--cc),0 0 26px color-mix(in srgb,var(--cc) 25%,transparent)}
.code{font-family:var(--f-mono);font-size:.76rem;color:var(--ink2);display:flex;align-items:center;gap:6px}
.code i{width:10px;height:10px;border-radius:3px;background:var(--cc);box-shadow:0 0 10px var(--cc)}
.bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.hero-course{display:flex;gap:18px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--ink2);cursor:pointer;padding:0;margin-bottom:12px;font-size:.85rem}
.back:hover{color:var(--accent)}
.status{font-size:.7rem;font-weight:700;border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--ink3)}
.status.s1{border-color:var(--warn);color:var(--warn)}
.status.s2{border-color:var(--good);color:#5fd35f}

/* Woche */
.wkl{display:flex;flex-direction:column}
.wkd{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}.wkd:first-child{border-top:0}
.wkd .dn{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;font-weight:600}.wkd .dd{font-family:var(--f-mono);font-size:.75rem;color:var(--ink3)}
.wkd.today .dn{color:var(--accent)}.wkd.today{background:linear-gradient(90deg,var(--accent-soft),transparent 60%);border-radius:8px;padding-left:8px;margin-left:-8px}
.wkd.past{opacity:.5}
.wke{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:baseline;padding:3px 0 3px 10px;border-left:3px solid var(--cc,var(--c-none));margin:2px 0;cursor:pointer}
.wke .t{font-family:var(--f-mono);font-size:.78rem;color:var(--ink2)}.wke .n{font-weight:600}.wke .r{font-size:.78rem;color:var(--ink3);margin-left:6px}
.wke.dl .n::before{content:"◆ ";color:var(--cc)}
.wkd .free{font-size:.8rem;color:var(--ink3)}

/* ===== Neues Design: ruhig, modern, hell und dunkel nach Systemeinstellung ===== */
:root{
  color-scheme:light dark;
  --bg:#F5F6F8; --bg2:#EEF0F3; --panel:#FFFFFF; --panel2:#F3F4F6; --line:#E6E8EC; --line2:#D5D9E0;

  --accent:#4F46E5; --accent2:#6366F1; --accent-soft:rgba(79,70,229,.09); --on-accent:#FFFFFF;
  --good:#16A34A; --warn:#D97706; --serious:#EA580C; --crit:#DC2626;
  --c-m11:#2563EB; --c-m13:#EA580C; --c-m14:#059669; --c-m15:#CA8A04; --c-m16:#DB2777; --c-m19:#16A34A; --c-none:#8A93A3;
  --f-display:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Inter",ui-sans-serif,system-ui,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --glass:rgba(255,255,255,.86); --crit-ink:#B91C1C; --good-ink:#15803D;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E0F13; --bg2:#15171C; --panel:#17191F; --panel2:#1F2229; --line:#262A33; --line2:#343944;
  --ink:#ECEEF2; --ink2:#AEB4C0; --ink3:#7E8594;
  --accent:#8B85FF; --accent2:#A5A0FF; --accent-soft:rgba(139,133,255,.13); --on-accent:#0E0F13;
  --c-m11:#60A5FA; --c-m13:#FB923C; --c-m14:#34D399; --c-m15:#FACC15; --c-m16:#F472B6; --c-m19:#4ADE80;
  --shadow:none; --glass:rgba(23,25,31,.86); --crit-ink:#F87171; --good-ink:#4ADE80;
}}
body.alltag{--accent:#16A34A;--accent2:#22C55E;--accent-soft:rgba(22,163,74,.10);--on-accent:#FFFFFF}

<div class="auth" id="auth" hidden><form id="authform" class="panel hud"><div class="label">Semesterboard</div><h1>Anmelden</h1>
<input type="email" id="a-mail" placeholder="E-Mail" autocomplete="email" required>

<button class="btn primary" id="a-login">Anmelden</button><button class="btn" type="button" id="a-signup">Konto erstellen</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>

<script>
const ICONS={
  heute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  woche:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  faecher:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg>',
  aufgaben:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>',
  notizen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 12h8M8 16h6"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  alltag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  training:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>',
  leistung:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>',
  analyse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  essen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M17 21V3c-2 1-3 4-3 8h3"/></svg>',
  gewicht:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 10a5 5 0 0 1 8 0M12 10l1.5-2"/></svg>'
};
const VIEWS=[["heute","Cockpit"],["woche","Woche"],["faecher","Fächer"]];
const AVIEWS=[["alltag","Fitness"],["training","Training"],["analyse","Analyse"],["leistung","Leistung"],["essen","Abendessen"]];
const COLS=["courses","events","tasks","steps","notes","digests","literature","timelog","reviews","news"];
// Alltag-Daten liegen in eigenen Tabellen (fit_*), getrennt von den Uni-Tabellen.
const FCOLS=["fit_workouts","fit_meals","fit_weight","fit_goals","fit_wellness","fit_recipes","recipe_requests","fit_analysis","fit_coach"];
const ALLC=[...COLS,...FCOLS];
const SEM_START=new Date(2026,9,1), SEM_END=new Date(2027,1,15);
const S={}; ALLC.forEach(c=>S[c]=[]);
let lastEv=null, ringsDone=false, db=null, loaded=false, view="heute", courseId=null, taskFilter="offen", taskCourse="", noteCourse="", tlRange="sem", fTab="faecher", wkOff=0;
const addOpen={task:false,note:false};
const F={course:"",len:25,left:25*60,running:false,started:null,int:null};
const isAlltag=v=>AVIEWS.some(x=>x[0]===v);
const lastOf={uni:"heute",alltag:"alltag"};
try{const r=localStorage.getItem("sb-tl"); if(r==="sem"||r==="wk") tlRange=r; if(localStorage.getItem("sb-ftab")==="pruef") fTab="pruef";}catch(e){}

/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=864e5;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const fromIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const daysUntil=d=>Math.round((sod(d)-sod(new Date()))/DAY);
const fDate=(d,o={weekday:"short",day:"2-digit",month:"2-digit"})=>new Date(d).toLocaleDateString("de-DE",o);
const fTime=d=>new Date(d).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const kw=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/DAY+1)/7)};
const course=id=>S.courses.find(c=>c.id===id);
const sortedCourses=()=>S.courses.slice().sort((a,b)=>a.code.localeCompare(b.code));
const cvar=id=>`var(--c-${course(id)?id:"none"})`;
const cChip=id=>{const c=course(id);return c?`<span class="chip"><span class="sw" style="background:${cvar(id)}"></span>${esc(c.short)}</span>`:""};

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}" ${p==null?'stroke-dasharray="3 5"':""}/>${p!=null?`<circle class="rg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${ringsDone?off:C}" data-off="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="filter:drop-shadow(0 0 4px ${color})"/>`:""}<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="pct">${label??(p==null?"–":p+"%")}</text></svg>`;
}

  S.events.forEach(e=>{const i=cs.findIndex(c=>c.id===e.course);if(i<0)return;const d=new Date(e.start);if(d<x0||d>x1)return;

    let mk;if(isDue(e)){mk=`<path class="mk" d="M${x} ${y-8}L${x+8} ${y}L${x} ${y+8}L${x-8} ${y}Z" fill="${e.kind==="exam"?"var(--bg)":col}" stroke="${col}" stroke-width="2.5"/>`}
    else mk=`<circle class="mk" cx="${x}" cy="${y}" r="${tlRange==="wk"?7:4.5}" fill="${col}" stroke="var(--panel)" stroke-width="2" opacity="${past?.35:1}"/>`;

  el.innerHTML=`<svg width="${W}" height="${H+14}" role="img" aria-label="Semester-Zeitleiste mit Vorlesungen, Abgaben und Prüfungen je Fach">${g}</svg>`;
}
function chartActivity(el){

  const ds=[...Array(days)].map((_,i)=>new Date(today.getTime()-(days-1-i)*DAY));

  const mins=ds.map(d=>{const k=iso(d);return S.timelog.filter(t=>t.date===k).reduce((a,t)=>a+t.minutes,0)});
  const max=Math.max(4,...cnt);const bw=(W-L)/days;const Y=v=>T+(H-T-B)*(1-v/max);
  let g='<g class="grid">';[0,max/2,max].forEach(v=>{g+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"/>`});g+='</g>';
  [0,Math.round(max/2),max].forEach(v=>g+=`<text x="${L-6}" y="${Y(v)}" text-anchor="end" dominant-baseline="central">${v}</text>`);
  ds.forEach((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,y=Y(cnt[i]),h=H-B-y;
    if(cnt[i]>0)g+=`<path d="M${x} ${H-B}V${y+3}a3 3 0 0 1 3-3h${w-6}a3 3 0 0 1 3 3V${H-B}Z" fill="var(--accent)" opacity="${i===days-1?1:.75}"/>`;
    if(i%2===(days-1)%2)g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${d.getDate()}.${d.getMonth()+1}.</text>`;
    g+=`<rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-tip="${esc(`<b>${fDate(d,{weekday:"long",day:"2-digit",month:"2-digit"})}</b><br>${cnt[i]} erledigt · ${fmtH(mins[i])} h Lernzeit`)}"/>`});

function chartBurndown(el,cid){
  const st=stepsOf(cid);const W=el.clientWidth,H=190,L=28,R=12,T=12,B=24;
  const dated=st.filter(s=>s.due).map(s=>fromIso(s.due));
  if(st.length<2||!dated.length){el.innerHTML='<div class="empty">Die Plan-Kurve erscheint, sobald der Plan mindestens zwei Schritte mit Datum hat.</div>';return}
  const dl=deadlines().filter(e=>e.course===cid);const end=dl.length?sod(dl[dl.length-1].start):new Date(Math.max(...dated));
  const start=new Date(Math.min(sod(new Date()).getTime(),Math.min(...dated)-7*DAY));const n=st.length;
  const X=d=>L+(W-L-R)*((d-start)/(end-start)),Y=v=>T+(H-T-B)*(1-v/n);
  const plan=[[start,n]];dated.sort((a,b)=>a-b).forEach((d,i)=>{plan.push([d,plan[plan.length-1][1]]);plan.push([d,n-i-1])});
  const today=sod(new Date());const act=[];for(let d=new Date(start);d<=today;d=new Date(d.getTime()+DAY)){const k=d.getTime()+DAY;act.push([d,n-st.filter(s=>s.done&&(!s.doneAt||new Date(s.doneAt).getTime()<k)).length])}
  let g='<g class="grid">';[0,Math.round(n/2),n].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/>`);g+='</g>';
  [0,Math.round(n/2),n].forEach(v=>g+=`<text x="${L-6}" y="${Y(v)}" text-anchor="end" dominant-baseline="central">${v}</text>`);
  for(let m=new Date(start.getFullYear(),start.getMonth()+1,1);m<=end;m=new Date(m.getFullYear(),m.getMonth()+1,1))g+=`<text x="${X(m)}" y="${H-6}" text-anchor="middle">${m.toLocaleDateString("de-DE",{month:"short"})}</text>`;
  const path=a=>a.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  g+=`<path d="${path(plan)}" fill="none" stroke="var(--ink3)" stroke-width="2" stroke-dasharray="5 4"/>`;
  const col=cvar(cid);g+=`<path d="${path(act)}" fill="none" stroke="${col}" stroke-width="2.5" style="filter:drop-shadow(0 0 4px ${col})"/>`;
  const last=act[act.length-1];if(last)g+=`<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="5" fill="${col}" stroke="var(--panel)" stroke-width="2"/>`;
  const tx=X(new Date());g+=`<line x1="${tx}" x2="${tx}" y1="${T}" y2="${H-B}" stroke="var(--accent)" stroke-dasharray="2 3"/>`;
  g+=`<line id="bd-x" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink2)" opacity="0"/><rect id="bd-hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" style="cursor:crosshair"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="Plan-Kurve: offene Schritte geplant gegenüber tatsächlich">${g}</svg><div class="legend"><span><i style="background:var(--ink3)"></i>Plan (offene Schritte laut Fälligkeit)</span><span><i style="background:${col}"></i>Tatsächlich offen</span></div>`;
  const hit=el.querySelector("#bd-hit"),xl=el.querySelector("#bd-x");
  const at=(arr,d)=>{let v=arr[0][1];for(const p of arr){if(p[0]<=d)v=p[1];else break}return v};
  hit.addEventListener("pointermove",ev=>{const r=hit.getBoundingClientRect();const f=(ev.clientX-r.left)/r.width;const d=sod(new Date(start.getTime()+f*(end-start)));const x=X(d);xl.setAttribute("x1",x);xl.setAttribute("x2",x);xl.setAttribute("opacity",".6");
    showTip(`<b>${fDate(d,{weekday:"short",day:"2-digit",month:"2-digit"})}</b><br><span class="c" style="background:var(--ink3)"></span>Plan: ${at(plan,d)} offen${d<=today?`<br><span class="c" style="background:${col}"></span>Tatsächlich: ${at(act,d)} offen`:""}`,ev.clientX,ev.clientY)});
  hit.addEventListener("pointerleave",()=>{xl.setAttribute("opacity","0");hideTip()});
}

  return `<section class="panel s5" aria-labelledby="h-focus"><div class="ph"><h2 id="h-focus">Fokus-Timer</h2><div class="seg" role="group" aria-label="Dauer">${[25,50,90].map(l=>`<button data-flen="${l}" aria-pressed="${F.len===l}">${l} min</button>`).join("")}</div></div>
    <div class="focus"><div class="dial"><svg width="132" height="132" aria-hidden="true"><circle cx="66" cy="66" r="58" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="fring" cx="66" cy="66" r="58" fill="none" stroke="${F.course?cvar(F.course):"var(--accent)"}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 66 66)" style="filter:drop-shadow(0 0 6px ${F.course?cvar(F.course):"var(--accent)"})"/></svg><div class="t"><div><span id="ftime">${mm}:${ss}</span><small>${F.running?"LÄUFT":"BEREIT"}</small></div></div></div>
    <div class="stack"><select class="sel" id="fcourse" aria-label="Fach für die Lernzeit">${courseOptions(F.course,"Fach wählen")}</select>
      <div class="row"><button class="btn primary" data-focus="${F.running?"pause":"start"}">${F.running?"Pause":"Start"}</button><button class="btn" data-focus="stop">Beenden und buchen</button></div>
      <div class="faint" style="font-size:.76rem">Die Zeit wird dem Fach als Lernzeit gutgeschrieben.</div></div></div></section>`;
}
function focusTick(){
  if(!F.running)return;F.left=Math.max(0,F.len*60-Math.round((Date.now()-F.started)/1000));
  const t=$("#ftime"),r=$("#fring");if(t)t.textContent=String(Math.floor(F.left/60)).padStart(2,"0")+":"+String(F.left%60).padStart(2,"0");
  if(r){const C=2*Math.PI*58;r.setAttribute("stroke-dashoffset",C*(1-F.left/(F.len*60)))}
  if(F.left===0){focusStop(true)}
}
function focusStop(done){
  const used=Math.round((F.len*60-F.left)/60);clearInterval(F.int);F.running=false;
  if(used>=1&&F.course)add("timelog",{course:F.course,minutes:used,date:iso(new Date())},`${used} min ${done?"Fokus geschafft und ":""}gebucht`);
  else if(used>=1)toast("Bitte ein Fach wählen, damit die Zeit gebucht wird.");
  F.left=F.len*60;render();
}

/* ---------- Essen: jeden Tag 3 Abendessen zur Auswahl, mit Rezept, Einkaufsliste und Foto (Daten in rezepte.json) ---------- */
let REZ=null,essDay=null,essTab="tag";
fetch("rezepte.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(d=>{if(d){REZ=d;if(isAlltag(view))render()}}).catch(()=>{});
const WDAYS=["Mo","Di","Mi","Do","Fr","Sa","So"],WDAYL=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const wdIdx=d=>(new Date(d).getDay()+6)%7;
/* Rezept-Pool: Grundstock aus rezepte.json plus neue Rezepte aus der Datenbank (fit_recipes, von der Rezept-Routine angelegt).
   Pro Tag 3 Abendessen, eins davon immer asiatisch. „Andere Vorschläge“ würfelt einen Tag neu, ohne die anderen Tage zu verändern. */
const recipesAll=()=>{if(!REZ)return[];const seen=new Set(),out=[];REZ.recipes.concat(S.fit_recipes.map(x=>x.data&&Object.assign({id:x.id},x.data)).filter(Boolean)).forEach(r=>{if(r&&r.id&&!seen.has(r.id)&&Array.isArray(r.ing)){seen.add(r.id);out.push(r)}});return out};
let PRC=null,PRCK="";
const PR=()=>{const k=S.fit_recipes.length+":"+(REZ?1:0);if(PRC&&PRCK===k)return PRC;PRC=Object.assign({},...S.fit_recipes.map(x=>x.data&&x.data.prices||{}),REZ?REZ.prices:{});PRCK=k;return PRC};
const mod=(a,n)=>((a%n)+n)%n;
const rollOf=i=>+(ls("sb-ess-roll-"+wkKey()+"-"+i)||0);
function mealsOf(i){
  const all=recipesAll();if(!all.length)return[];
  const A=all.filter(r=>r.asian),O=all.filter(r=>!r.asian);
  const wn=Math.round((monday(new Date())-new Date(2026,0,5))/(7*DAY)),s=wn*7+i+rollOf(i)*7;
  const a=A.length?A[mod(s,A.length)]:null,o=[];
  for(let t=0;o.length<(a?2:3)&&t<O.length;t++){const r=O[mod(2*s+t,O.length)];if(!o.includes(r))o.push(r)}
  const arr=o.slice();if(a)arr.splice(mod(s,3),0,a);
  return arr.map((r,k)=>Object.assign({},r,{opt:k}));
}
const eur=v=>v.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
function inPack(i,p){let q=i.q;if(i.u===p[2])return q;if(i.u==="Scheibe"||i.u==="Scheiben")return q*50;if(i.u==="Zehe")return q/10;if(i.u==="Stängel")return q/8;if(i.u==="Stk"&&p[2]==="g")return q*100;return q}
const unitP=p=>p[2]==="g"?` (${eur(p[3]/p[1]*1000)}/kg)`:p[2]==="ml"?` (${eur(p[3]/p[1]*1000)}/l)`:p[1]>1?` (${eur(p[3]/p[1])}/${p[2]})`:"";

function chartWeight(el){
  const all=weights(),W=el.clientWidth,H=220,L=40,R=14,T=14,B=24;
  const from=wRange?iso(addDays(new Date(),-wRange)):"";const ws=all.filter(w=>w.date>=from);

  const gt=goals().weightTarget,tgt=gt!=null?Number(gt):null;
  const t0=fromIso(ws[0].date).getTime(),t1=Math.max(fromIso(ws[ws.length-1].date).getTime(),sod(new Date()).getTime());
  const vals=ws.map(w=>Number(w.kg));let lo=Math.min(...vals),hi=Math.max(...vals);
  if(tgt!=null&&Math.abs(tgt-(lo+hi)/2)<15){lo=Math.min(lo,tgt);hi=Math.max(hi,tgt)}
  const pad=Math.max(.5,(hi-lo)*.12);lo=Math.floor((lo-pad)*2)/2;hi=Math.ceil((hi+pad)*2)/2;
  const X=t=>L+(W-L-R)*((t-t0)/Math.max(DAY,t1-t0)),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));

  let g='<g class="grid">';for(let i=0;i<=4;i++)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(lo+(hi-lo)*i/4)}" y2="${Y(lo+(hi-lo)*i/4)}"/>`;g+='</g>';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<text x="${L-6}" y="${Y(v)}" text-anchor="end" dominant-baseline="central">${num(v,1)}</text>`}
  const nT=Math.min(5,Math.max(2,Math.floor((W-L)/90)));for(let i=0;i<nT;i++){const t=t0+(t1-t0)*i/(nT-1);g+=`<text x="${X(t)}" y="${H-6}" text-anchor="${i===0?"start":i===nT-1?"end":"middle"}">${fDate(t,{day:"2-digit",month:"2-digit"})}</text>`}
  if(tgt!=null&&tgt>=lo&&tgt<=hi)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(tgt)}" y2="${Y(tgt)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${Y(tgt)-6}" text-anchor="end" style="fill:#5fd35f">Ziel ${kg(tgt)}</text>`;
  const path=a=>a.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  g+=`<path d="${path(ws.map(w=>[fromIso(w.date).getTime(),Number(w.kg)]))}" fill="none" stroke="var(--ink3)" stroke-width="1.2" opacity=".7"/>`;
  g+=`<path d="${path(avg7)}" fill="none" stroke="var(--accent)" stroke-width="2.5" style="filter:drop-shadow(0 0 4px var(--accent))"/>`;
  ws.forEach((w,i)=>{const t=fromIso(w.date).getTime(),x=X(t),y=Y(Number(w.kg));g+=`<g class="hit" data-tip="${esc(`<b>${fDate(t,{weekday:"short",day:"2-digit",month:"2-digit"})}</b><br>${kg(w.kg)} kg · Schnitt ${kg(avg7[i][1])} kg`)}"><circle cx="${x}" cy="${y}" r="10" fill="transparent"/><circle class="mk" cx="${x}" cy="${y}" r="3" fill="var(--ink2)"/></g>`});

}

/* 3) Wochenbelastung */
function lzWeek(c){const sec="wk",m0=monday(new Date());const dayL=k=>{const x=c.days.find(d=>d.d===k);return x?x.l:0};
  const wkSum=m=>{let s=0;for(let i=0;i<7;i++)s+=dayL(iso(addDays(m,i)));return s};
  const weeks=[...Array(15)].map((_,i)=>addDays(m0,7*(i-14))),sums=weeks.map(wkSum);
  const band=i=>i>=3?(sums[i-1]+sums[i-2]+sums[i-3])/3:null;const cur=sums[14],b=band(14);
  const st=b==null?"in":cur>1.18*b?"over":cur<.82*b?"under":"in",stT={over:"über dem Band",in:"im Band",under:"unter dem Band"}[st];
  const stCol={over:"var(--serious)",in:"var(--accent)",under:"var(--ink3)"}[st];
  const days=[...Array(7)].map((_,i)=>dayL(iso(addDays(m0,i)))),dmx=Math.max(...days,1);
  const bars=days.map((v,i)=>`<div class="lz-db"><i style="height:${Math.max(2,64*v/dmx)}px"></i><span>${"MDMDFSS"[i]}</span></div>`).join("");
  const W=680,H=110,P=10,sh=weeks.slice(3),mxv=Math.max(...sums.slice(3),...sh.map((_,k)=>(band(k+3)||0)*1.18))*1.1||1,X=k=>P+(W-2*P)*k/(sh.length-1),Y=v=>H-6-(H-14)*v/mxv;
  let up="",lo="";sh.forEach((_,k)=>{const bb=band(k+3)||0;up+=(k?"L":"M")+X(k)+","+Y(bb*1.18);});for(let k=sh.length-1;k>=0;k--){lo+="L"+X(k)+","+Y((band(k+3)||0)*.82)}
  let pts="";sh.forEach((w,k)=>{const v=sums[k+3];if(k===sh.length-1)pts+=`<line x1="${X(k)}" x2="${X(k)}" y1="${Y(0)}" y2="${Y(v)}" stroke="${stCol}"/><circle cx="${X(k)}" cy="${Y(v)}" r="5" fill="${stCol}"/>`;else pts+=`<circle cx="${X(k)}" cy="${Y(v)}" r="4" fill="none" stroke="var(--ink2)" stroke-width="1.5"/>`});
  let dates="";[0,4,8,11].forEach(k=>{if(sh[k])dates+=`<text x="${X(k)}" y="${H+12}" text-anchor="${k===0?"start":k===11?"end":"middle"}">${fDate(sh[k],{day:"2-digit",month:"2-digit"})}</text>`});
  return `<section class="lz-sec"><div class="lz-cap">Wochenbelastung</div>
    <div class="lz-wk"><div class="lz-dbars">${bars}</div><div style="text-align:right">${lzNum(cur,0,"","wk","sum","lz-xl",`color:${stCol}`)}<div class="lz-lab" style="color:${stCol}">${stT}</div></div></div>
    <svg class="lz-svg" viewBox="0 0 ${W} ${H+16}" role="img" aria-label="Wochenbelastung 12 Wochen mit Band"><path d="${up}${lo}Z" fill="var(--ink)" opacity=".07"/>${pts}${dates}</svg>
    ${lzLink("Wie das Band entsteht",sec,"band")}
    ${lzKlappe(sec,"band",lzF("Wochensumme = Summe der Tagesbelastung Mo bis So\nBand       = 0,82 bis 1,18 × Schnitt der drei Wochen davor")+`<div class="lz-in">Diese Woche ${Math.round(cur)} · Vorwochen ${sums.slice(11,14).map(Math.round).join(", ")} · Schnitt ${b!=null?Math.round(b):"–"} · Band ${b!=null?Math.round(.82*b)+" bis "+Math.round(1.18*b):"–"}</div><p>${b==null?"Zu wenige Wochen für ein Band.":st==="over"?`Diese Woche liegt ${Math.round(100*(cur/b-1))} % über deinem Schnitt der letzten drei Wochen.`:st==="under"?`Diese Woche liegt ${Math.round(100*(1-cur/b))} % unter deinem Schnitt, ${new Date().getDay()===0?"die Woche ist damit leichter als zuletzt":"die Woche läuft aber noch"}.`:"Diese Woche liegt im Rahmen deiner letzten drei Wochen."}</p>`)}
    ${lzKlappe(sec,"sum",`<p>Summe der Belastung aller Einheiten seit Montag: ${Math.round(cur)}.</p>`)}
  </section>`}

function lzZones(c){const sec="zo",from=iso(addDays(new Date(),-84)),z=[0,0,0,0,0];let n=0;
  c.acts.forEach(a=>{if(a.date>=from&&a._hrs){a._z.forEach((s,i)=>z[i]+=s);n++}});
  const tot=z.reduce((a,b)=>a+b,0)||1,low=(z[0]+z[1])/tot,mx=Math.max(...z)||1;
  const head=low>=.5?`${Math.round(low*100)} Prozent deiner Zeit liegen unten`:`${Math.round((1-low)*100)} Prozent deiner Zeit liegen ab Zone 3`;
  const rows=z.map((s,i)=>`<div class="lz-zr"><span class="lz-zl">Z${i+1}</span><span class="lz-zb">${s?`<i style="--w:${(100*s/mx).toFixed(1)}%;background:${LZ_PULSE[i]};--d:${i*.08}s"></i>`:""}</span><span class="lz-zt">${lzH(s)}</span></div>`).join("");
  const zn=["Regeneration","Grundlage","Tempo","Schwelle","Maximal"],zb=c.zb;
  const full=z.map((s,i)=>`<tr><td><i class="lz-sw" style="background:${LZ_PULSE[i]}"></i>Z${i+1} ${zn[i]}</td><td>${i===0?"bis "+Math.round(zb[1]-1):i===4?"ab "+Math.round(zb[4]):Math.round(zb[i])+"–"+Math.round(zb[i+1]-1)} bpm</td><td>${lzH(s)}</td><td>${Math.round(100*s/tot)} %</td></tr>`).join("");
  // Tempo-km in den letzten 12 Wochen
  const pk=[0,0,0,0,0,0];c.acts.forEach(a=>{if(a.date>=from&&a.paceKm&&a.paceKm.hist)for(const k in a.paceKm.hist){const zi=c.paceZone(+k+2.5);if(zi!=null)pk[zi]+=a.paceKm.hist[k]/1000}});
  const ptot=pk.reduce((a,b)=>a+b,0)||1;
  const ptab=c.pz?c.pz.map((p,i)=>`<tr><td><i class="lz-sw" style="background:${LZ_PACE[i]}"></i>${c.PZN[i]}</td><td>${i===0?"langsamer als "+lzPace(p.fast):i===5?"schneller als "+lzPace(p.slow):lzPace(p.fast)+"–"+lzPace(p.slow)} /km</td><td>${fh(pk[i])} km</td><td>${Math.round(100*pk[i]/ptot)} %</td></tr>`).join(""):"";
  const mxs=c.mx,f=c.formula;
  const maxTxt=`Im Profil steht kein Maximalpuls${c.profMax?` (Profil: ${c.profMax})`:""}. Gemessen: höchster mindestens 10 s gehaltener Puls ${mxs} bpm am ${fDate(fromIso(c.mxAct.date))} (${esc(c.mxAct.name||"")}). Das ist eine Untergrenze, kein gemessener Maximalpuls. Zum Vergleich 220 − Alter = ${f}, ${mxs>f?mxs-f+" Schläge darunter":f-mxs+" Schläge darüber"}; die Formel streut um rund 12 Schläge.`;
  return `<section class="lz-sec" data-zones><div class="lz-cap">Zonen</div><div class="lz-big" style="font-size:1.35rem">${head}</div>
    <div class="lz-zones">${rows}</div>
    ${lzLink("Zonen, Grenzen und Tempo",sec,"all")}
    ${lzKlappe(sec,"all",`<p>Zeitraum: letzte 12 Wochen, ${n} Einheiten mit Puls, alle Sportarten. Gerechnet gegen deine Zonen, nicht gegen die der Uhr.</p><table class="lz-t">${full}</table>${ptab?`<table class="lz-t" style="margin-top:10px">${ptab}</table>`:""}
      <p>Pulszonen aus deiner Laktatschwelle ${c.lthr} bpm (von Garmin automatisch erkannt, Messdatum liefert Garmin nicht): Z1 bis 85 %, Z2 85–89 %, Z3 90–94 %, Z4 95–99 %, Z5 ab 100 % der Schwelle.</p>
      ${c.base?`<p>Tempozonen nach Daniels aus VDOT ${fh(c.base.vEff)}: ${(c.base.D/1000).toLocaleString("de-DE")} km in ${fmtDur(c.base.t)} am ${fDate(fromIso(c.base.date))} (${c.base.src}${c.base.recent?"":", älter als 18 Monate, mit 5 % Abschlag"}). Grenzen zwischen den Daniels-Bereichen auf die Mitte gelegt. Gerechnet ${c.acts.some(a=>a.paceKm&&a.paceKm.gap)?"steigungsbereinigt (GAP)":"ohne Steigungsbereinigung"}.</p>`:""}
      <p>${maxTxt}</p>`)}
  </section>`}
/* 5) Coach */
function lzCoach(c,runs){const f=lzFinding(c,runs),sec="co";
  return `<section class="lz-sec lz-coach"><div class="lz-ch"><span class="lz-dot"></span><b>Coach</b><span class="lz-src">AUS DEINEN GARMIN-DATEN</span></div>
    <p class="lz-ct">${f?esc(f.short):"Für einen belastbaren Befund reichen die Daten gerade nicht."}</p>
    ${f?`<button class="lz-cbtn" data-lzk="co:more" aria-expanded="${LZ.open.co==="more"}">Mehr dazu</button>${lzKlappe(sec,"more",`<p><b>${esc(f.title)}</b></p><p>${esc(f.text)}</p><ul class="lz-ev">${f.ev.map(e=>`<li>${e}</li>`).join("")}</ul><p><b>Diese Woche:</b> ${esc(f.todo)}</p>`)}`:""}
  </section>`}
function lzFinding(c,runs){
  const from=iso(addDays(new Date(),-84)),R=runs.filter(a=>a.date>=from),out=[];
  const wk=m=>R.filter(a=>a.date>=iso(m)&&a.date<=iso(addDays(m,6))),m0=monday(new Date());
  const weeks=[...Array(12)].map((_,i)=>addDays(m0,7*(i-11))).map(m=>({m,runs:wk(m),km:wk(m).reduce((s,a)=>s+(a.distM||0)/1000,0)}));
  const E=c.pz?c.pz[1]:null;
  // A: Anteil locker
  if(c.pz){const pk=[0,0,0,0,0,0];R.forEach(a=>{if(a.paceKm&&a.paceKm.hist)for(const k in a.paceKm.hist){const z=c.paceZone(+k+2.5);if(z!=null)pk[z]+=a.paceKm.hist[k]/1000}});
    const tot=pk.reduce((a,b)=>a+b,0);if(tot>30){const easy=(pk[0]+pk[1])/tot,mid=(pk[2]+pk[3])/tot;
      if(easy<.7)out.push({score:(.75-easy)*10+mid*2,short:"Deine lockeren Läufe sind zu schnell, ein großer Teil deiner Kilometer liegt im mittleren Tempo. Für mehr Grundlage und frischere harte Tage sollten mehr Läufe wirklich langsam sein.",
        title:"Zu viel im mittleren Tempo",text:`Nach deinen eigenen Tempozonen lagen in den letzten 12 Wochen nur ${Math.round(easy*100)} % der Kilometer im lockeren Bereich. Üblich für Grundlagentraining sind rund 75 bis 80 %.`,
        ev:[`${Math.round(easy*100)} % von ${Math.round(tot)} km locker (${fDate(fromIso(from))} bis heute)`,`${Math.round(mid*100)} % im Marathon- und Schwellenbereich`,`locker heißt für dich ${lzPace(E.fast)} bis ${lzPace(E.slow)} /km (VDOT ${fh(c.base.vEff)})`],
        todo:`Zwei Läufe à 45 bis 50 Minuten komplett bei ${lzPace(E.fast+15)} bis ${lzPace(E.slow-10)} /km, auch bergauf langsamer statt schneller.`})}}
  // B: Umfangssprünge
  const jumps=[];for(let i=1;i<weeks.length;i++){const p=weeks[i-1].km,k=weeks[i].km;if(p>=10&&k>p*1.3)jumps.push({w:weeks[i],p,k,drop:weeks[i+1]&&weeks[i+1].km<p*.7})}
  if(jumps.length>=2)out.push({score:jumps.length*1.2+jumps.filter(j=>j.drop).length,short:"Dein Laufumfang springt mehrmals stark nach oben und bricht danach wieder ein. Gleichmäßigere Wochen bringen mehr und senken das Verletzungsrisiko.",
    title:"Umfangssprünge über 30 Prozent",text:`In den letzten 12 Wochen gab es ${jumps.length} Wochen mit mehr als 30 % Laufkilometern als in der Vorwoche${jumps.some(j=>j.drop)?", meist mit einem Einbruch danach":""}.`,
    ev:jumps.slice(-3).map(j=>`KW ${kw(j.w.m)}: ${fh(j.k)} km nach ${fh(j.p)} km (+${Math.round(100*(j.k/j.p-1))} %)`),
    todo:`Diese Woche ${fh(Math.max(...weeks.slice(-4).map(w=>w.km))*0.9)} km nicht überschreiten und auf 3 Läufe verteilen, in den Folgewochen höchstens 10 % mehr.`});
  // C: Frische dauerhaft tief
  const last21=c.days.slice(-21),low=last21.filter(d=>d.tsb<-20).length;
  if(low>=14)out.push({score:low/3,short:"Du baust Ermüdung seit Wochen nicht mehr ab. Eine ruhigere Woche würde dir jetzt mehr bringen als eine weitere harte.",
    title:"Frische dauerhaft unter −20",text:`An ${low} der letzten 21 Tage lag deine Frische unter −20.`,ev:[`Frische heute ${Math.round(c.days[c.days.length-1].tsb)}`,`tiefster Wert ${Math.round(Math.min(...last21.map(d=>d.tsb)))} am ${fDate(fromIso(last21.reduce((a,b)=>b.tsb<a.tsb?b:a).d))}`,`Ermüdung ${Math.round(c.days[c.days.length-1].atl)} gegen Fitness ${Math.round(c.days[c.days.length-1].ctl)}`],
    todo:"Diese Woche Umfang um ein Drittel senken, nur lockere Läufe, ein kompletter Ruhetag."});
  // D: langer Lauf fehlt
  const recent=weeks.slice(-6),longs=recent.map(w=>w.runs.reduce((m,a)=>Math.max(m,(a.movingS||a.durS)),0)),wkm=recent.map(w=>w.km);
  const noLong=longs.filter(s=>s<75*60).length,active=recent.filter(w=>w.km>0).length;
  if(active>=4&&noLong>=active-1&&E)out.push({score:noLong*.8,short:"In deinen Wochen fehlt ein langer, ruhiger Lauf. Er ist der wichtigste Baustein für Ausdauer und kostet wenig Erholung.",
    title:"Kein langer Lauf",text:`In ${noLong} der letzten ${recent.length} Wochen war kein Lauf länger als 75 Minuten.`,
    ev:recent.slice(-3).map((w,i)=>`KW ${kw(w.m)}: längster Lauf ${lzH(longs[recent.length-3+i])} bei ${fh(w.km)} km Woche`),
    todo:`Am Wochenende 80 bis 90 Minuten bei ${lzPace(E.slow-15)} bis ${lzPace(E.slow)} /km, flach, ohne Tempo am Ende.`});
  out.sort((a,b)=>b.score-a.score);return out[0]||null}

function lzBest(c){const sec="be",NAMES={400:"400 m",1000:"1 km",1609:"1 Meile",5000:"5 km",10000:"10 km",16093:"10 Meilen",21097:"Halbmarathon",42195:"Marathon"};

  const rec=c.prof.records||{};
  const tab=ds.slice().reverse().map(D=>{const o=c.own[D],g=rec[D];return `<tr><td>${NAMES[D]}</td><td>${fmtDur(o.t)}</td><td>${lzPace(o.t/D*1000)}</td><td>${fDate(fromIso(o.date),{day:"2-digit",month:"2-digit",year:"2-digit"})}</td><td>${g?fmtDur(g.s)+" ("+(g.date||"").slice(0,4)+")":"–"}</td></tr>`}).join("");
  const tgt=[[5000,"5 km","time5K"],[10000,"10 km","time10K"],[21097,"Halbmarathon","timeHalfMarathon"],[42195,"Marathon","timeMarathon"]];
  const rp=c.prof.race_pred||{};
  const pred=tgt.map(([D,n,k])=>{let bb=null;Object.keys(c.own).map(Number).forEach(b=>{if(b<1000)return;const r=D/b;if(r>8||r<1/8)return;const o=c.own[b],v=c.vdotOf(b,o.t);if(!bb||v>bb.v)bb={b,o,v}});
    const rie=bb?bb.o.t*Math.pow(D/bb.b,1.06):null,dan=c.VD?c.raceT(D,c.VD):null;
    return `<tr><td>${n}</td><td>${rie?fmtDur(rie):"–"}</td><td>${dan?fmtDur(dan):"–"}</td><td>${rp[k]?fmtDur(rp[k]):"–"}</td></tr>`}).join("");
  return `<section class="lz-sec"><div class="lz-cap">Bestleistungen</div>
    <div class="lz-best">${top.map(D=>`<div class="lz-br">${emb(D)}<b>${NAMES[D]}</b><span>(${fmtDur(c.own[D].t)})</span></div>`).join("")||'<div class="empty">Noch keine Bestleistungen aus Punktreihen.</div>'}</div>
    ${lzLink("Alle Strecken und die Vorhersage",sec,"all")}
    ${lzKlappe(sec,"all",`<p>Schnellstes Fenster über die Distanzreihe deiner Läufe der letzten 12 Monate, mit verstrichener Zeit. Rechts die Rekorde, die Garmin führt (über die ganze Zeit).</p><table class="lz-t"><thead><tr><th>Strecke</th><th>Zeit</th><th>/km</th><th>Datum</th><th>Garmin</th></tr></thead><tbody>${tab}</tbody></table>
      <table class="lz-t" style="margin-top:10px"><thead><tr><th>Vorhersage</th><th>Riegel</th><th>Daniels</th><th>dein Gerät</th></tr></thead><tbody>${pred}</tbody></table>
      ${lzF("Riegel:  Zielzeit = Bestzeit · (Zieldistanz / Bestdistanz)^1,06   (höchstens Faktor 8)\nDaniels: Zielzeit aus VDOT "+(c.VD?fh(c.VD):"–"))}<p>Die Spanne zwischen zwei Rechenwegen ist keine Panne, sondern die ehrliche Spanne.</p>`)}
  </section>`}

  if(t.dataset.strava)return stravaSync();
  if(t.dataset.add){const k=t.dataset.add;addOpen[k]=!addOpen[k];render();if(addOpen[k]){const i=document.querySelector({task:"#t-title",note:"[data-addnote=''] textarea",workout:"#f-workout [name=title]",meal:"#f-meal [name=title]"}[k]);if(i)i.focus()}return}
  if(t.dataset.brief)return t.dataset.brief==="open"?openBrief():closeBrief();
  if(t.dataset.go){closeBrief();return go(t.dataset.go)}
  if(t.dataset.wk!==undefined){wkOff=+t.dataset.wk===0?0:wkOff+(+t.dataset.wk);return render()}
  if(t.dataset.ftab){fTab=t.dataset.ftab;try{localStorage.setItem("sb-ftab",fTab)}catch(err){};return render()}
  if(t.dataset.tl){tlRange=t.dataset.tl;try{localStorage.setItem("sb-tl",tlRange)}catch(err){};return render()}
  if(t.dataset.flen){if(F.running)return toast("Erst den laufenden Timer beenden.");F.len=+t.dataset.flen;F.left=F.len*60;return render()}
  if(t.dataset.focus){const a=t.dataset.focus;
    if(a==="start"){if(!F.course)return toast("Bitte zuerst ein Fach wählen.");F.running=true;F.started=Date.now()-(F.len*60-F.left)*1000;F.int=setInterval(focusTick,1000);return render()}
    if(a==="pause"){F.running=false;clearInterval(F.int);return render()}
    if(a==="stop")return focusStop(false)}
  if(t.dataset.focusfor){F.course=t.dataset.focusfor;return go("heute")}
  if(t.dataset.course!==undefined&&t.dataset.course)return go("faecher",t.dataset.course);
  if(t.dataset.del){const [c,id]=t.dataset.del.split("/");return del(c,id,"Gelöscht")}
  if(t.dataset.tf){taskFilter=t.dataset.tf;return render()}
  if(t.dataset.time){const [cid,m]=t.dataset.time.split("|");return add("timelog",{course:cid,minutes:+m,date:iso(new Date())},`${m} min gebucht`)}
  if(t.dataset.lit){const l=S.literature.find(x=>x.id===t.dataset.lit);return upd("literature",l.id,{status:((l.status||0)+1)%3})}
  if(t.dataset.accept){const [did,i]=t.dataset.accept.split("|");const d=S.digests.find(x=>x.id===did);const sug=d.tasks[+i];
    add("tasks",{title:sug.title,due:sug.due||"",course:sug.course||"",prio:!!sug.prio,done:false,source:"mail"},"Aufgabe übernommen").then(()=>upd("digests",did,{tasks:d.tasks.map((x,j)=>j===+i?{...x,accepted:true}:x)}));return}
  if(t.dataset.backplan)return backplan(t.dataset.backplan);
});
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[data-gcal]");if(a)upd("events",a.dataset.gcal,{gcal:"manual"},"Als eingetragen markiert")});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.toggle){const [c,id]=t.dataset.toggle.split("/");upd(c,id,{done:t.checked,doneAt:t.checked?new Date().toISOString():null},t.checked?"✓ Erledigt":null);return}
  if(t.id==="tc"){taskCourse=t.value;render()}
  if(t.id==="nc"){noteCourse=t.value;render()}
  if(t.id==="fcourse"){F.course=t.value;render()}
  if(t.id==="fday"&&t.value){foodDay=t.value;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#brief").hidden){closeBrief();return}});
document.addEventListener("submit",e=>{
  const f=e.target;if(f.id==="authform")return;e.preventDefault();
  if(f.id==="f-task"){add("tasks",{title:$("#t-title").value.trim(),due:$("#t-due").value,course:$("#t-course").value,prio:$("#t-prio").checked,done:false,source:"dashboard"},"Aufgabe gespeichert");f.reset();addOpen.task=false;render();return}
  if(f.id==="f-event"){const d=$("#ev-date").value;const mk=t=>new Date(d+"T"+(t||"00:00")).toISOString();const nid=(crypto.randomUUID?crypto.randomUUID():String(Date.now()));lastEv=nid;add("events",{id:nid,title:$("#ev-title").value.trim(),start:mk($("#ev-from").value),end:mk($("#ev-to").value),allDay:false,location:$("#ev-loc").value.trim(),course:$("#ev-course").value,kind:"own"},"Termin gespeichert");f.reset();return}
  if(f.dataset.addstep!==undefined){const cid=f.dataset.addstep;const st=stepsOf(cid);add("steps",{course:cid,title:f.elements.title.value.trim(),due:f.elements.due.value,owner:f.elements.owner.value.trim(),done:false,order:st.length?Math.max(...st.map(s=>s.order??0))+1:0},"Schritt hinzugefügt");f.reset();return}
  if(f.dataset.addnote!==undefined){const cid=f.dataset.addnote||(f.elements.course?f.elements.course.value:"");add("notes",{text:f.elements.text.value.trim(),course:cid,eventId:f.elements.event?f.elements.event.value:""},"Notiz gespeichert");f.reset();if(f.dataset.addnote===""){addOpen.note=false;render()}return}
  if(f.id==="f-workout"){const E=f.elements,done=E.done.checked;add("fit_workouts",{title:E.title.value.trim(),date:E.date.value,time:E.time.value,type:E.type.value,durationMin:E.dur.value?+E.dur.value:null,kcal:E.kcal.value?+E.kcal.value:null,details:E.details.value.trim(),done,doneAt:done?new Date().toISOString():null},done?"Training eingetragen":"Training geplant");addOpen.workout=false;render();return}
  if(f.id==="f-meal"){const E=f.elements;add("fit_meals",{date:foodDay,meal:E.meal.value,title:E.title.value.trim(),kcal:+E.kcal.value||0,protein:E.protein.value?+E.protein.value:null},"Mahlzeit gespeichert");f.reset();E.title.focus();return}
  if(f.id==="f-weight"){const E=f.elements,d=E.date.value,v=+E.kg.value,ex=S.fit_weight.find(w=>w.date===d);if(ex)upd("fit_weight",ex.id,{kg:v},"Gewicht aktualisiert");else add("fit_weight",{date:d,kg:v},"Gewicht gespeichert");f.reset();return}
  if(f.id==="f-goals"){if(!uid)return;const E=f.elements,n=x=>x.value===""?null:+x.value;
    write(()=>sb.from("fit_goals").upsert(toRow("fit_goals",{id:uid,kcalTarget:n(E.kcalTarget),baseBurn:n(E.baseBurn),proteinTarget:n(E.proteinTarget),weightTarget:n(E.weightTarget)})),"Ziele gespeichert","fit_goals");return}
  if(f.dataset.addlit!==undefined){const cid=f.dataset.addlit;add("literature",{course:cid,title:f.elements.title.value.trim(),status:0,order:S.literature.filter(l=>l.course===cid).length},"Quelle hinzugefügt");f.reset();return}
});
async function backplan(cid){
  const dl=deadlines().filter(e=>e.course===cid);if(!dl.length)return;
  const end=new Date(sod(dl[dl.length-1].start).getTime()-3*DAY);const start=sod(new Date());
  const open=stepsOf(cid).filter(s=>!s.done);if(!open.length)return toast("Alle Schritte sind erledigt.");
  const span=Math.max(1,(end-start)/DAY);
  for(let i=0;i<open.length;i++){const d=new Date(start.getTime()+Math.round(span*(i+1)/open.length)*DAY);await upd("steps",open[i].id,{due:iso(d)})}
  toast(`${open.length} Schritte neu terminiert`);
}

/* ---------- Start ---------- */
ALLC.forEach(c=>{try{const v=localStorage.getItem("sb-cache-"+c);if(v)S[c]=JSON.parse(v)}catch(e){}});
render();
let channel=null;
async function startData(){
  const dot=$("#syncdot"),txt=$("#synctext");$("#auth").hidden=true;$("#logout").hidden=false;
  try{await Promise.all(ALLC.map(load));loaded=true;render();maybeBrief()}catch(e){txt.textContent="Fehler";toast("Daten konnten nicht geladen werden.");return}
  const timers={};
  channel=sb.channel("board").on("postgres_changes",{event:"*",schema:"public"},p=>{const t=p.table;if(!ALLC.includes(t))return;clearTimeout(timers[t]);timers[t]=setTimeout(()=>load(t).catch(()=>{}),250)})
    .subscribe(st=>{if(st==="SUBSCRIBED"){dot.classList.add("live");txt.textContent="Live"}else if(st==="CLOSED"||st==="CHANNEL_ERROR"||st==="TIMED_OUT"){dot.classList.remove("live");txt.textContent="Getrennt"}});
}
let bootHash=null;
const pageHash=()=>fetch("index.html",{cache:"no-cache"}).then(r=>r.ok?r.text():null).then(t=>{if(!t)return null;let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h}).catch(()=>null);
pageHash().then(h=>bootHash=h);
/* Strava sofort abgleichen: Supabase-Funktion strava-sync holt neue Aktivitäten direkt von Strava. */
let stravaBusy=false;
async function stravaSync(){
  if(stravaBusy)return;if(!navigator.onLine)return toast("Du bist offline. Bitte später erneut versuchen.");
  stravaBusy=true;const b=$("#stravabtn");if(b)b.classList.add("spin");
  try{
    const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error("login");
    const r=await fetch(window.SB_URL+"/functions/v1/strava-sync",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:window.SB_KEY,"Content-Type":"application/json"},body:"{}"});
    const js=await r.json().catch(()=>({}));
    if(js.needsAuth){if(confirm("Strava ist noch nicht verbunden. Jetzt einmalig bei Strava freigeben?"))location.href=js.url;return}
    if(!r.ok)throw new Error(js.error||r.status);
    await load("fit_workouts");render();
    toast(js.added?`${js.added} neue ${js.added===1?"Aktivität":"Aktivitäten"} von Strava`:"Strava ist aktuell");
  }catch(e){console.warn("Strava-Sync",e);toast("Strava-Abgleich hat nicht geklappt.")}
  finally{stravaBusy=false;const b2=$("#stravabtn");if(b2)b2.classList.remove("spin")}
}
(()=>{const q=new URLSearchParams(location.search),v=q.get("strava");if(!v)return;
  history.replaceState(null,"",location.pathname+location.hash);
  if(v==="ok"){setTimeout(()=>{toast("Strava verbunden");stravaSync()},1500)}
  else setTimeout(()=>toast(v==="rechte"?"Bitte bei Strava das Lesen der Aktivitäten erlauben.":"Strava-Verbindung hat nicht geklappt."),1500)})();
async function refreshAll(){
  if(!navigator.onLine)return toast("Du bist offline. Bitte später erneut versuchen.");
  const b=$("#refresh");if(b)b.classList.add("spin");
  try{if("serviceWorker" in navigator){const r=await navigator.serviceWorker.getRegistration();if(r)await r.update().catch(()=>{})}
    // Neue App-Version erkennen: dann ganz neu laden, sonst nur die Daten.
    const h=await pageHash();if(h&&bootHash&&h!==bootHash){location.reload();return}
    await Promise.all(ALLC.map(load));render();toast("Aktualisiert")}catch(e){toast("Aktualisieren hat nicht geklappt.")}
  const b2=$("#refresh");if(b2)b2.classList.remove("spin");
}
function showAuth(){$("#auth").hidden=false;$("#logout").hidden=true;$("#synctext").textContent="Abgemeldet"}
$("#authform").addEventListener("submit",async e=>{e.preventDefault();e.stopPropagation();$("#a-err").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("#a-mail").value.trim(),password:$("#a-pass").value});
  if(error)$("#a-err").textContent="Anmeldung fehlgeschlagen. E-Mail oder Passwort prüfen. Noch kein Konto? Dann zuerst auf „Konto erstellen“ tippen.";});
$("#a-signup").addEventListener("click",async()=>{$("#a-err").textContent="";const email=$("#a-mail").value.trim(),password=$("#a-pass").value;
  if(!email||password.length<8){$("#a-err").textContent="Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.";return}
  const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error)$("#a-err").textContent="Konto konnte nicht erstellt werden: "+error.message;
  else if(!data.session)$("#a-err").textContent="Konto angelegt. Bitte den Link in der Bestätigungsmail öffnen (oder Claude Bescheid geben) und dich dann hier anmelden.";});
$("#logout").addEventListener("click",async()=>{await sb.auth.signOut();ALLC.forEach(c=>{S[c]=[];try{localStorage.removeItem("sb-cache-"+c)}catch(e){}});render()});
let started=false,uid=null;
sb.auth.onAuthStateChange((ev,session)=>{uid=session?session.user.id:null;if(session&&!started){started=true;startData()}else if(!session){started=false;if(channel){sb.removeChannel(channel);channel=null}showAuth()}});
addEventListener("online",()=>{render();if(started)ALLC.forEach(c=>load(c).catch(()=>{}))});addEventListener("offline",render);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{}));
let raf=0;function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const a=document.activeElement;if(a&&a.closest&&a.closest("form")&&a.value)return setTimeout(schedule,800);render()})}
setInterval(()=>{const n=new Date();const c=$("#clock");if(c)c.innerHTML=`${fTime(n)}<span class="sec">${String(n.getSeconds()).padStart(2,"0")}</span>`;const cd=$("#nextcd");if(cd)cd.textContent=countdownText(new Date(+cd.dataset.at))},1000);
setInterval(()=>{if(!document.activeElement||!document.activeElement.closest("form"))render()},5*60000);
let rz=0;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(drawCharts,150)});
